<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio"
               name="payment[method]"
               class="radio"
               data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()" />
        <label data-bind="attr: {'for': getCode()}" class="label">
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>
    <div class="payment-method-content">
        <div class="payment-method-billing-address">
            <!-- ko foreach: getRegion('billing-address-form') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="message message-error" role="alert" data-bind="visible: message, text: message"></div>
        <div class="actions-toolbar">
            <!-- ko if: isOrderPlaced() -->
            <button type="button" class="action primary" data-bind="click: startPayment, enable: !isProcessing()"><span data-bind="i18n: 'Retry payment'"></span></button>
            <!-- /ko -->
            <!-- ko ifnot: isOrderPlaced() -->
            <button type="button" class="action primary" data-bind="click: placeOrder, enable: (getCode() == isChecked())"><span data-bind="i18n: 'Place Order'"></span></button>
            <!-- /ko -->
        </div>
    </div>
</div>
